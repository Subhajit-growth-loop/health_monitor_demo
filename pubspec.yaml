name: health_monitor_demo
description: "Offline-first Health Monitor app (Flutter + Riverpod, Clean Architecture)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Local persistence (source of truth for the UI)
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4  # enables the local DB on desktop/tests
  path: ^1.9.0
  path_provider: ^2.1.5

  # Connectivity detection (drives the sync layer)
  connectivity_plus: ^6.1.0

  # Charts — "show the data properly"
  fl_chart: ^0.69.2

  # Formatting & ids
  intl: ^0.20.2
  uuid: ^4.5.1

  # Responsive sizing across screen sizes
  flutter_screenutil: ^5.9.3
  health: ^13.3.1
  http: ^1.6.0

  # Background alerts
  flutter_local_notifications: ^18.0.0
  workmanager: ^0.5.2
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
